<title>ZIZI Pagos Prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Concepto: ventanilla digital de una sola columna para el alumno; el personal y la jefatura ven tablas y listas cortas. */
:root{
  --bg:#F5F7F3; --surface:#FFFFFF; --ink:#1E2B2B; --muted:#4A5A5A; --line:#D5DFDC;
  --brand:#146466; --brand-2:#5AABA9; --sand:#E2E2C4; --alert:#C92F1C; --ok:#1F7A4D; --warn:#8A5A00; --warn-bg:#FFF4CC; --ok-bg:#DDF1E6; --alert-bg:#FBE4E0;
  --on-brand:#FFFFFF;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1A; --surface:#172525; --ink:#E8EFEC; --muted:#A8BAB6; --line:#2C4040;
  --brand:#5AABA9; --brand-2:#7CC3C1; --sand:#2B3A36; --alert:#FF8A78; --ok:#7BD8A4; --warn:#F0C766; --warn-bg:#3A3112; --ok-bg:#173A29; --alert-bg:#412220;
  --on-brand:#0F1A1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1A; --surface:#172525; --ink:#E8EFEC; --muted:#A8BAB6; --line:#2C4040;
  --brand:#5AABA9; --brand-2:#7CC3C1; --sand:#2B3A36; --alert:#FF8A78; --ok:#7BD8A4; --warn:#F0C766; --warn-bg:#3A3112; --ok-bg:#173A29; --alert-bg:#412220;
  --on-brand:#0F1A1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:880px;margin:0 auto}
.test{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:8px 12px;margin:0 -16px;text-align:center;font-weight:500}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px 0}
.brand{font-weight:700;font-size:20px;color:var(--brand);letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap}
nav button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:7px;cursor:pointer;min-height:40px}
nav button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px}
p.lead{color:var(--muted);margin:0 0 20px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid{display:grid;gap:16px}
.steps{display:flex;gap:8px;margin:0 0 20px;padding:0;list-style:none;flex-wrap:wrap}
.steps li{font-size:13px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.steps li.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.steps li.done{color:var(--ok);border-color:var(--ok)}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input[type=text],select{font:inherit;width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.btn{font:inherit;font-weight:600;min-height:48px;padding:10px 22px;border-radius:8px;border:0;background:var(--brand);color:var(--on-brand);cursor:pointer}
.btn.sec{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.small{min-height:36px;padding:6px 14px;font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.opt input{margin-top:4px;width:20px;height:20px;accent-color:var(--brand)}
.opt b{display:block}.opt span{font-size:14px;color:var(--muted)}
.amount{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--alert-bg);color:var(--alert)}
.ref{font-size:28px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--brand);margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.ok-box{background:var(--ok-bg);color:var(--ok);padding:14px 16px;border-radius:10px;font-weight:600;margin-bottom:16px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--muted)}
.mini{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;max-width:90vw;z-index:20}
@media (prefers-reduced-motion:no-preference){.card,.kpi{animation:in .25s ease-out}@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
<div class="test" role="note">Prototipo con datos simulados. No escribas datos reales ni de tarjeta. Pasarela y factura en modo de prueba.</div>
<div class="wrap">
<header>
  <div class="brand">ZIZI · Pagos del Instituto<small>Si es con ZIZI, es easy</small></div>
  <nav aria-label="Vista del prototipo">
    <button data-role="alumno" aria-pressed="true">Soy estudiante</button>
    <button data-role="personal" aria-pressed="false">Recursos Financieros</button>
    <button data-role="jefatura" aria-pressed="false">Jefatura</button>
  </nav>
</header>
<main id="app" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const money=n=>'$'+n.toLocaleString('es-MX',{minimumFractionDigits:2});
// Datos de ejemplo (simulados)
let CAT=[
 {id:'c1',nombre:'Constancia de estudios',monto:100,nota:'Ejemplo de monto'},
 {id:'c2',nombre:'Reinscripción',monto:1500,nota:'Ejemplo de monto'},
 {id:'c3',nombre:'Credencial',monto:120,nota:'Ejemplo de monto'}];
const ALUMNO={control:'24000001',nombre:'Alumno de ejemplo',correo:'alumno.ejemplo@correo.test'};
let state={role:'alumno',view:'inicio',cuota:null,forma:'linea',ref:null,pagos:[
  {f:'05/11/2026',c:'Constancia de estudios',m:100,e:'Confirmado',fac:'Enviada'}],
  exc:[{id:1,mov:'Depósito de cajero',monto:100,fecha:'13/11/2026',ref:'2400000X4',cand:['24000004 · Constancia de estudios ($100.00)','24000040 · Constancia de estudios ($100.00)']}]};
function dig(c){let s=0;for(const ch of c)s=(s*7+Number(ch))%10;return String(s)}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
const pasos=['Tu número de control','Elige qué pagar','Paga','Listo'];
function stepper(n){return `<ol class="steps" aria-label="Avance">${pasos.map((p,i)=>`<li class="${i<n?'done':i===n?'on':''}" ${i===n?'aria-current="step"':''}>${i+1}. ${p}</li>`).join('')}</ol>`}
const V={};
V.inicio=()=>`${stepper(0)}<h1>Paga tus cuotas sin ir a la ventanilla</h1>
<p class="lead">Escribe tu número de control, elige lo que vas a pagar y paga desde tu celular. Te avisamos en cuanto el pago se registre y te enviamos tu factura por correo.</p>
<form class="card grid" id="f1"><div><label for="nc">Número de control</label><input id="nc" type="text" inputmode="numeric" autocomplete="off" value="24000001" maxlength="8"><p class="hint" id="nch">Son 8 números. Ejemplo: 24000001</p></div>
<div class="row"><button class="btn" type="submit">Continuar</button></div></form>
<p class="mini" style="margin-top:14px">¿Ya pagaste? <a href="#" data-go="historial" style="color:var(--brand)">Mira el estado de tus pagos</a></p>`;
V.cuota=()=>`${stepper(1)}<h1>Hola, ${ALUMNO.nombre}</h1><p class="lead">Elige la cuota y cómo quieres pagarla.</p>
<form class="grid" id="f2"><fieldset style="border:0;padding:0;margin:0" class="grid"><legend class="sr" style="font-weight:700;margin-bottom:8px">¿Qué vas a pagar?</legend>
${CAT.map((c,i)=>`<label class="opt"><input type="radio" name="cuota" value="${c.id}" ${i===0?'checked':''}><div><b>${c.nombre}</b><span>${c.nota}</span></div><div class="amount">${money(c.monto)}</div></label>`).join('')}</fieldset>
<fieldset style="border:0;padding:0;margin:0" class="grid"><legend style="font-weight:700;margin-bottom:8px">¿Cómo quieres pagar?</legend>
<label class="opt"><input type="radio" name="forma" value="linea" checked><div><b>En línea, con tarjeta</b><span>Se confirma al instante</span></div></label>
<label class="opt"><input type="radio" name="forma" value="ref"><div><b>Con referencia, en cajero o por transferencia</b><span>Se confirma cuando el banco la registra</span></div></label></fieldset>
<div class="row"><button class="btn sec" type="button" data-go="inicio">Atrás</button><button class="btn" type="submit">Continuar</button></div></form>`;
V.linea=()=>{const c=state.cuota;return `${stepper(2)}<h1>Pago con tarjeta</h1><p class="lead">Vas a pagar <b>${c.nombre}</b> por <b>${money(c.monto)}</b>.</p>
<form class="card grid" id="f3"><p class="hint" style="margin:0;color:var(--warn);font-weight:600">Modo de prueba: usa la tarjeta de prueba que ya está escrita. No uses una tarjeta real.</p>
<div><label for="tj">Número de tarjeta de prueba</label><input id="tj" type="text" value="4242 4242 4242 4242" inputmode="numeric" autocomplete="off"></div>
<div class="row"><div style="flex:1;min-width:120px"><label for="vc">Vencimiento</label><input id="vc" type="text" value="12/34"></div><div style="flex:1;min-width:120px"><label for="cv">Código</label><input id="cv" type="text" value="123"></div></div>
<div class="row"><button class="btn sec" type="button" data-go="cuota">Atrás</button><button class="btn" type="submit">Pagar ${money(c.monto)}</button></div></form>`};
V.ref=()=>{const c=state.cuota;return `${stepper(2)}<h1>Tu referencia de pago</h1><p class="lead">Paga <b>${money(c.monto)}</b> por <b>${c.nombre}</b> en cualquier cajero BBVA o por transferencia usando esta referencia. Guárdala o captura la pantalla.</p>
<div class="card"><div class="mini">Referencia (válida solo para este pago)</div><div class="ref" id="rr">${state.ref}</div>
<div class="row" style="margin-top:12px"><button class="btn small sec" id="cp" type="button">Copiar referencia</button><span class="pill warn">Pendiente de pago</span></div>
<p class="hint">Cuando el banco registre tu pago te lo avisamos por correo y aquí. No tienes que ir a la ventanilla.</p></div>
<div class="card" style="margin-top:16px"><h2>Solo para la demostración</h2><p class="hint" style="margin-top:0">Simula que el banco ya registró el pago de esta referencia.</p><div class="row"><button class="btn small" id="sim" type="button">Simular depósito del banco</button><button class="btn small sec" id="simx" type="button">Simular depósito con referencia mal escrita</button></div></div>
<div class="row" style="margin-top:16px"><button class="btn sec" data-go="cuota">Atrás</button><button class="btn sec" data-go="historial">Ver mis pagos</button></div>`};
V.listo=()=>{const c=state.cuota;return `${stepper(4)}<div class="ok-box" role="status">Pago registrado. Gracias.</div><h1>Tu pago ya quedó</h1>
<div class="card grid"><div><div class="mini">Concepto</div><b>${c.nombre}</b></div><div><div class="mini">Monto</div><b>${money(c.monto)}</b></div>
<div><div class="mini">Factura de prueba</div><b>Enviada a ${ALUMNO.correo}</b><p class="hint">En el prototipo la factura no tiene validez fiscal.</p></div>
<div class="row"><button class="btn" data-go="historial">Ver mis pagos</button><button class="btn sec" data-go="inicio">Hacer otro pago</button></div></div>`};
V.historial=()=>`<h1>Tus pagos</h1><p class="lead">Número de control ${ALUMNO.control}</p><div class="card scroll"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Estado</th><th>Factura</th></tr></thead><tbody>
${state.pagos.map(p=>`<tr><td>${p.f}</td><td>${p.c}</td><td>${money(p.m)}</td><td><span class="pill ${p.e==='Confirmado'?'ok':p.e==='Pendiente'?'warn':'bad'}">${p.e}</span></td><td>${p.fac}</td></tr>`).join('')}</tbody></table></div>
<div class="row" style="margin-top:16px"><button class="btn" data-go="inicio">Hacer un pago</button></div>`;
// Personal
V.exc=()=>`<h1>Pagos por revisar</h1><p class="lead">El sistema identifica los pagos solo. Aquí aparecen únicamente los que no pudo identificar.</p>
${state.exc.length?state.exc.map(x=>`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${x.mov} · ${money(x.monto)}</b><span class="pill bad">No identificado</span></div>
<p class="hint">Fecha ${x.fecha}. Referencia recibida: <b>${x.ref}</b> (no coincide con ninguna).</p>
<label for="s${x.id}">Asignar a</label><select id="s${x.id}">${x.cand.map(c=>`<option>${c}</option>`).join('')}<option>Ninguno: marcar como pago por reclamar</option></select>
<div class="row" style="margin-top:12px"><button class="btn small" data-asig="${x.id}">Asignar y facturar</button></div></div>`).join(''):`<div class="card"><b>No hay pagos por revisar.</b><p class="hint">Todo lo que llegó hoy se identificó automáticamente.</p></div>`}`;
V.corte=()=>{const base={'Constancia de estudios':900,'Reinscripción':940,'Credencial':0};state.pagos.filter(p=>p.e==='Confirmado'&&p.f!=='05/11/2026').forEach(p=>{base[p.c]=(base[p.c]||0)+p.m});const tot=Object.values(base).reduce((a,x)=>a+x,0);const pend=state.exc.reduce((a,x)=>a+x.monto,0);
return `<h1>Corte y conciliación del día</h1><p class="lead">Se genera solo al cierre. Datos de ejemplo.</p>
<div class="kpis"><div class="kpi"><b>${money(tot)}</b><span>Ingresos del día</span></div><div class="kpi"><b>${12+state.pagos.filter(p=>p.e==='Confirmado'&&p.f!=='05/11/2026').length}</b><span>Pagos confirmados</span></div><div class="kpi"><b>${state.exc.length}</b><span>Por revisar</span></div></div>
<div class="card scroll"><h2>Conciliación con el banco</h2><table><thead><tr><th>Concepto</th><th>Sistema</th><th>Banco</th><th>Diferencia</th></tr></thead><tbody>
${Object.entries(base).filter(e=>e[1]>0).map(e=>`<tr><td>${e[0]}</td><td>${money(e[1])}</td><td>${money(e[1])}</td><td><span class="pill ok">Sin diferencia</span></td></tr>`).join('')}
<tr><td>Pago sin identificar</td><td>${money(0)}</td><td>${money(pend)}</td><td><span class="pill ${pend?'bad':'ok'}">${pend?'Por revisar':'Sin diferencia'}</span></td></tr></tbody></table>
<p class="hint">El reporte llega por correo al responsable de la conciliación.</p></div>`};
V.cat=()=>`<h1>Catálogo de cuotas</h1><p class="lead">Solo personal autorizado. Cada cambio queda en el historial.</p>
<div class="card scroll"><table><thead><tr><th>Concepto</th><th>Monto</th><th>Vigencia</th></tr></thead><tbody>${CAT.map(c=>`<tr><td>${c.nombre}</td><td>${money(c.monto)}</td><td>2026</td></tr>`).join('')}</tbody></table></div>
<form class="card grid" id="fc" style="margin-top:16px"><h2>Agregar una cuota autorizada</h2><div><label for="cn">Concepto</label><input id="cn" type="text" placeholder="Ejemplo: Examen especial"></div><div><label for="cm">Monto</label><input id="cm" type="text" inputmode="decimal" placeholder="Ejemplo: 250"></div><div class="row"><button class="btn" type="submit">Guardar cuota</button></div></form>`;
V.tablero=()=>{const conf=state.pagos.filter(p=>p.e==='Confirmado');const items=[['Reinscripción',62],['Constancia de estudios',34+conf.length],['Credencial',9]];const mx=Math.max(...items.map(i=>i[1]));return `<h1>Tablero de pagos</h1><p class="lead">Estado del cobro sin pedir reportes al personal. Datos de ejemplo.</p>
<div class="kpis"><div class="kpi"><b>${105+conf.length}</b><span>Pagos del mes</span></div><div class="kpi"><b>${money(32180+conf.reduce((a,p)=>a+p.m,0))}</b><span>Ingresos del mes</span></div><div class="kpi"><b>8</b><span>Referencias pendientes</span></div><div class="kpi"><b>${state.exc.length}</b><span>Por revisar</span></div></div>
<div class="card"><h2>Pagos por concepto</h2>${items.map(i=>`<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><span>${i[0]}</span><b>${i[1]}</b></div><div class="bar" aria-hidden="true"><i style="width:${i[1]/mx*100}%"></i></div></div>`).join('')}</div>`};
const NAVS={alumno:'inicio',personal:'exc',jefatura:'tablero'};
function subnav(){if(state.role!=='personal')return '';return `<div class="row" style="margin-bottom:16px"><button class="btn small ${state.view==='exc'?'':'sec'}" data-go="exc">Por revisar</button><button class="btn small ${state.view==='corte'?'':'sec'}" data-go="corte">Corte y conciliación</button><button class="btn small ${state.view==='cat'?'':'sec'}" data-go="cat">Catálogo de cuotas</button></div>`}
function render(){const app=$('#app');app.innerHTML=subnav()+V[state.view]();
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===state.role));
  try{history.replaceState(null,'','#'+state.view)}catch(e){}
  bind();}
function go(v,role){if(role)state.role=role;state.view=v;render();window.scrollTo(0,0)}
window.go=go;
function bind(){
  document.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.go)});
  const f1=$('#f1');if(f1)f1.onsubmit=e=>{e.preventDefault();const v=$('#nc').value.trim();if(!/^\d{8}$/.test(v)){const h=$('#nch');h.textContent='Revisa tu número de control: deben ser 8 números.';h.style.color='var(--alert)';$('#nc').focus();return}go('cuota')};
  const f2=$('#f2');if(f2)f2.onsubmit=e=>{e.preventDefault();state.cuota=CAT.find(c=>c.id===f2.cuota.value);state.forma=f2.forma.value;if(state.forma==='linea')go('linea');else{state.ref=ALUMNO.control+dig(ALUMNO.control)+String(CAT.indexOf(state.cuota)+1);go('ref')}};
  const f3=$('#f3');if(f3)f3.onsubmit=e=>{e.preventDefault();addPago('Confirmado');go('listo')};
  const cp=$('#cp');if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(state.ref).then(()=>toast('Referencia copiada'),()=>toast('Selecciona y copia la referencia'))}catch(e){toast('Selecciona y copia la referencia')}};
  const sim=$('#sim');if(sim)sim.onclick=()=>{addPago('Confirmado');toast('El banco registró tu pago');go('listo')};
  const simx=$('#simx');if(simx)simx.onclick=()=>{state.exc.push({id:Date.now(),mov:'Depósito de cajero',monto:state.cuota.monto,fecha:'13/11/2026',ref:state.ref.slice(0,-1)+'X',cand:[ALUMNO.control+' · '+state.cuota.nombre+' ('+money(state.cuota.monto)+')']});toast('Pago enviado a revisión del personal');};
  document.querySelectorAll('[data-asig]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.asig);state.exc=state.exc.filter(x=>x.id!==id);toast('Pago asignado y factura enviada');render()});
  const fc=$('#fc');if(fc)fc.onsubmit=e=>{e.preventDefault();const n=$('#cn').value.trim(),m=parseFloat($('#cm').value);if(!n||!(m>0)){toast('Escribe el concepto y un monto mayor a cero');return}CAT.push({id:'c'+(CAT.length+1),nombre:n,monto:m,nota:'Ejemplo de monto'});toast('Cuota guardada con historial');render()};
}
function addPago(e){state.pagos.unshift({f:'13/11/2026',c:state.cuota.nombre,m:state.cuota.monto,e,fac:'Enviada'})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(NAVS[b.dataset.role],b.dataset.role));
